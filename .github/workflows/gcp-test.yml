name: Connect to GCP via WIF

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write # Gives GitHub permission to ask for a secure token
  contents: read  

jobs:
  gcp-auth-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # This handles the secure digital handshake with Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        # 1. REPLACE WITH YOUR 12-DIGIT PROJECT NUMBER:
        workload_identity_provider: 'projects/434004613631/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        
        # 2. REPLACE WITH YOUR FULL SERVICE ACCOUNT EMAIL:
        service_account: 'github-deployer@YOUR_PROJECT_://gserviceaccount.com'

    # This tests if the authentication worked by listing authorized accounts
    - name: Test Connection
      run: |
        gcloud auth list
